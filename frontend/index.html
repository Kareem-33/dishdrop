<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>
      DishDrop - Turn Cooking Videos Into Recipes You Can Actually Cook From
    </title>
    <meta
      name="description"
      content="Paste a link to any cooking video from TikTok, Instagram, or YouTube and DishDrop turns it into a structured, editable recipe - ingredients, steps, and all. Save, organize, and plan meals from the videos you already love."
    />
    <meta name="author" content="DishDrop" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://dishdrop-ai.vercel.app/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DishDrop" />
    <meta property="og:url" content="https://dishdrop-ai.vercel.app/" />
    <meta
      property="og:title"
      content="DishDrop – Turn Cooking Videos into Recipes"
    />

    <meta
      property="og:description"
      content="Paste a TikTok, YouTube, Instagram, or Facebook cooking video and instantly get a structured recipe."
    />
    <meta property="og:image" content="https://dishdrop-ai.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="DishDrop - Turn Cooking Videos Into Recipes You Can Actually Cook From"
    />
    <meta
      name="twitter:description"
      content="Paste a link to any cooking video from TikTok, Instagram, or YouTube and DishDrop turns it into a structured, editable recipe - ingredients, steps, and all."
    />
    <meta name="twitter:image" content="https://dishdrop.app/og-image.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#F97316" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "DishDrop",
        "url": "https://dishdrop-ai.vercel.app/",
        "description": "DishDrop turns social media cooking videos into structured, editable recipes with smart collections, search, and meal planning.",
        "applicationCategory": "LifestyleApplication",
        "operatingSystem": "Web"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
